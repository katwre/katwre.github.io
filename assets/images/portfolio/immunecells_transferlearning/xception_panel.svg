<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" font-family="DejaVu Sans, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9z" fill="#55555f"/></marker></defs>
<rect width="760" height="250" fill="#fff"/>
<g text-anchor="middle">
  <rect x="10" y="62" width="110" height="60" rx="8" fill="#fdf1e0" stroke="#c9781c"/>
  <text x="65" y="87" font-size="13" font-weight="bold" fill="#8a4f0e">Cell image</text>
  <text x="65" y="106" font-size="11" fill="#5e5e68">150 × 150 × 3</text>

  <rect x="140" y="62" width="145" height="60" rx="8" fill="#efeef2" stroke="#7a7684"/>
