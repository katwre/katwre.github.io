  <text x="575" y="70" font-size="11" font-weight="bold" fill="#13604d">test accuracy 0.93</text>

  <rect x="475" y="104" width="200" height="72" rx="8" fill="#f6f5f8" stroke="#aaa6b0"/>
  <text x="575" y="125" font-size="13" font-weight="bold" fill="#3c3946">Classical ML baselines</text>
